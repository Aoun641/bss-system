{% extends "base.html" %}
{% block title %}Student Scanner{% endblock %}

{% block content %}
<div class="page-container" style="text-align: center; padding-top: 20px;">
    <h2 class="page-title" style="color: #00e5ff; font-size: 28px; margin-bottom: 8px;">📱 Student Scanner</h2>
    <p style="color: #94a3b8; margin-bottom: 20px;">Tap Start to activate iPad camera and audio.</p>

    <!-- Start Button -->
    <button id="startScanBtn" class="btn-neon btn-sm" style="background: linear-gradient(135deg, #00e5ff, #0284c7); padding: 14px 32px; font-size: 17px; margin-bottom: 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(0,229,255,0.4);">
        ▶️ Start Scanner
    </button>

    <!-- Camera Container -->
    <div id="cameraWrapper" style="display: none; position: relative; width: 100%; max-width: 600px; margin: 0 auto; border-radius: 20px; overflow: hidden; border: 3px solid #00e5ff; box-shadow: 0 0 40px rgba(0,229,255,0.2); background: #000; aspect-ratio: 4/3;">
        <video id="videoFeed" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <div class="hud hud-tl"></div><div class="hud hud-tr"></div>
        <div class="hud hud-bl"></div><div class="hud hud-br"></div>
        <div class="laser-line"></div>
    </div>

    <!-- Live Results Box -->
    <div id="resultBox" class="glass-card" style="display: none; margin: 25px auto 0; max-width: 600px; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; color: #fff; min-height: 60px; align-items: center; justify-content: center;">
        <span style="color: #94a3b8; animation: pulseText 1.5s infinite;">Scanning surroundings...</span>
    </div>

    <div style="margin-top: 25px;">
        <a href="/dashboard" class="btn-neon btn-sm" style="background: #334155; color: #fff; border: none; padding: 10px 20px; text-decoration: none;">← Back to Dashboard</a>
    </div>
</div>

<style>
.hud { position: absolute; width: 40px; height: 40px; border-color: #00e5ff; border-style: solid; z-index: 10; opacity: 0.8; }
.hud-tl { top: 20px; left: 20px; border-width: 4px 0 0 4px; border-top-left-radius: 10px; }
.hud-tr { top: 20px; right: 20px; border-width: 4px 4px 0 0; border-top-right-radius: 10px; }
.hud-bl { bottom: 20px; left: 20px; border-width: 0 0 4px 4px; border-bottom-left-radius: 10px; }
.hud-br { bottom: 20px; right: 20px; border-width: 0 4px 4px 0; border-bottom-right-radius: 10px; }
.laser-line { position: absolute; left: 0; width: 100%; height: 3px; background: #00ff88; box-shadow: 0 0 20px #00ff88, 0 0 40px #00e5ff; animation: scanSweep 2s linear infinite; z-index: 9; }
@keyframes scanSweep { 0% { top: 5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 95%; opacity: 0; } }
@keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>

<script>
const video = document.getElementById('videoFeed');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const resultBox = document.getElementById('resultBox');
let isScanning = false;

function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
}

function playErrorBuzz() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
}

function speakVoice(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0; utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
    }
}

document.getElementById('startScanBtn').addEventListener('click', async function() {
    this.style.display = 'none';
    document.getElementById('cameraWrapper').style.display = 'block';
    resultBox.style.display = 'flex';
    
    playBeep();

    let stream = null;
    
    // iPad/iOS Safari Compatible getUserMedia fallback
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    } catch (e1) {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
        } catch (e2) {
            resultBox.innerHTML = `<span style="color:#ff3366; font-size:15px; line-height:1.5;">
                ⚠️ Camera permission denied on iPad.<br>
                <small style="color:#fff;">1. Make sure address bar starts with <b>https://</b><br>2. Go to iPad <b>Settings ⚙️ → Safari → Camera</b> and set to <b>Allow</b>.</small>
            </span>`;
            return;
        }
    }

    video.srcObject = stream;
    try { await video.play(); } catch(e) {}

    setInterval(() => { 
        if(video.readyState >= 2) captureAndSend(); 
    }, 800);
});

async function captureAndSend() {
    if (isScanning) return; 
    isScanning = true;

    canvas.width = video.videoWidth || 640; 
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    try {
        const res = await fetch('/api/scan-student', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ frame: canvas.toDataURL('image/jpeg', 0.6) })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            playBeep();
            speakVoice(`Scan successful. Welcome, ${data.name}`);
            resultBox.innerHTML = `<span style="color:#00ff88; font-size:22px;">✅ ${data.name} (${data.class})<br><small style="color:#fff;">Marked ${data.attendance_status}</small></span>`;
            document.querySelector('.laser-line').style.background = "#00ff88"; 
            setTimeout(() => { isScanning = false; }, 2000);
            return;
        } 
        else if (data.status === 'duplicate') {
            playBeep();
            speakVoice(`Already scanned`);
            resultBox.innerHTML = `<span style="color:#facc15;">⚠️ ${data.name} already scanned at ${data.time}</span>`;
            document.querySelector('.laser-line').style.background = "#facc15"; 
            setTimeout(() => { isScanning = false; }, 2000);
            return;
        } 
        else if (data.status === 'unrecognized') {
            playErrorBuzz();
            speakVoice(`Face not recognized`);
            resultBox.innerHTML = `<span style="color:#ff3366;">❌ Face not recognized! Please register first.</span>`;
            document.querySelector('.laser-line').style.background = "#ff3366";
            setTimeout(() => { isScanning = false; }, 1500);
            return;
        }
        else if (data.status === 'spoof') {
            playErrorBuzz();
            speakVoice("Fake face detected");
            resultBox.innerHTML = `<span style="color:#ff3366;">🚨 FAKE FACE BLOCKED!</span>`;
            document.querySelector('.laser-line').style.background = "#ff3366";
            setTimeout(() => { isScanning = false; }, 2000);
            return;
        } 
        else {
            resultBox.innerHTML = `<span style="color:#94a3b8; animation: pulseText 1.5s infinite;">Scanning surroundings...</span>`;
            document.querySelector('.laser-line').style.background = "#00e5ff"; 
        }
    } catch (e) {}

    setTimeout(() => { isScanning = false; }, 300);
}
</script>
{% endblock %}
