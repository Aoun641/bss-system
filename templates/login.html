{% extends "base.html" %}
{% block title %}Login - BSS v2.0{% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    body, html { background-color: #030712 !important; margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; }

    .login-page-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #03060f; display: flex; justify-content: center; align-items: center; z-index: 999; }
    
    .bss-card-container { position: relative; width: 860px; height: 500px; background: rgba(10, 16, 26, 0.92); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(0, 229, 255, 0.2); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 229, 255, 0.08); display: flex; overflow: hidden; opacity: 0; animation: fadeCardIn 1.5s ease 0.5s forwards; }

    .visual-panel { flex: 1; position: relative; background: linear-gradient(180deg, #070e18 0%, #03060c 100%); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 40px; }

    .lamp-wrapper { position: absolute; top: -150px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 5; animation: dropLamp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards; }
    .lamp-wire { width: 2px; height: 120px; margin-top: -60px; background: linear-gradient(to bottom, #555, #222); }
    .lamp-head { width: 90px; height: 50px; background: linear-gradient(135deg, #3a4454 0%, #1a2230 100%); clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%); }
    .lamp-bulb-glow { width: 30px; height: 14px; background: #111; border-radius: 0 0 15px 15px; margin-top: -1px; animation: bulbFlicker 0.8s ease-out 3.0s forwards; }

    .light-cone { position: absolute; top: 120px; left: 50%; transform: translateX(-50%) scaleY(0); transform-origin: top center; width: 320px; height: 380px; background: linear-gradient(180deg, rgba(0, 229, 255, 0.75) 0%, rgba(0, 229, 255, 0.35) 40%, rgba(0, 229, 255, 0.03) 90%, transparent 100%); clip-path: polygon(12% 0%, 88% 0%, 100% 100%, 0% 100%); pointer-events: none; z-index: 2; opacity: 0; animation: lightBeamOn 0.8s ease-out 3.3s forwards; }

    .robot-mascot-container { position: relative; z-index: 4; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(120px); animation: robotRiseUp 1s cubic-bezier(0.16, 1, 0.3, 1) 4.0s forwards; }
    .robot-head-shell { width: 150px; height: 110px; background: radial-gradient(circle at 35% 30%, #0e1a2b 0%, #040812 100%); border: 2.5px solid #00e5ff; border-radius: 45px 45px 38px 38px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.7), inset 0 0 15px rgba(0, 229, 255, 0.4); display: flex; justify-content: center; align-items: center; overflow: hidden; animation: floatMascot 4s ease-in-out infinite alternate 5.0s; }
    .face-scanner-visor { width: 125px; height: 85px; background: rgba(3, 10, 20, 0.95); border-radius: 25px; border: 1px solid rgba(0, 229, 255, 0.4); display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    .scan-face-img { width: 75px; height: 75px; object-fit: contain; filter: drop-shadow(0 0 8px #00e5ff); opacity: 0.95; animation: pulseFace 2s infinite alternate; }
    .laser-scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #00ffcc; box-shadow: 0 0 12px #00ffcc, 0 0 30px #00e5ff; animation: laserScanSweep 2.5s ease-in-out infinite 4.5s; opacity: 0; }

    .hud-corner { position: absolute; width: 12px; height: 12px; border-color: #00e5ff; border-style: solid; opacity: 0.7; }
    .hud-tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .hud-tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .hud-bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .hud-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }
    .robot-floor-shadow { width: 110px; height: 14px; background: radial-gradient(ellipse, rgba(0, 229, 255, 0.6) 0%, transparent 70%); margin-top: 14px; border-radius: 50%; filter: blur(4px); }

    .form-panel { flex: 1.25; padding: 45px 50px; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 3; overflow: hidden; }
    .form-panel::before { content: ""; position: absolute; top: 0; left: -150%; width: 70%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%); transform: skewX(-20deg); z-index: 99; pointer-events: none; animation: panelShineSweep 1.5s ease-in-out 7.5s forwards; }

    .anim-item { opacity: 0; transform: translateX(20px); }
    .delay-1 { animation: formSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 5.0s forwards; } 
    .delay-2 { animation: formSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 5.5s forwards; } 
    .delay-3 { animation: formSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 6.0s forwards; } 
    .delay-4 { animation: formSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 6.5s forwards; } 

    .form-header { margin-bottom: 30px; text-align: left; }
    .form-header h2 { font-size: 32px; font-weight: 800; color: #ffffff; margin: 0; letter-spacing: -0.5px; }
    .form-header h2 span { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
    .form-header p { color: #7b8e9d; font-size: 13.5px; margin-top: 6px; margin-bottom: 0; }

    .input-box-group { margin-bottom: 20px; text-align: left; }
    .input-box-group label { display: block; color: #00e5ff; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
    .input-field-container { position: relative; display: flex; align-items: center; }
    .input-field-container svg { position: absolute; left: 16px; width: 18px; height: 18px; stroke: #4f6378; transition: stroke 0.3s ease; pointer-events: none; }
    .input-field-container input { width: 100%; padding: 14px 16px 14px 48px; background: rgba(13, 22, 35, 0.85); border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 12px; color: #ffffff; font-size: 14px; outline: none; transition: all 0.3s ease; }
    .input-field-container input:focus { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.25); background: rgba(18, 30, 48, 0.95); }
    .input-field-container input:focus ~ svg { stroke: #00e5ff; }

    .btn-neon-glow { width: 100%; padding: 15px; margin-top: 10px; background: linear-gradient(90deg, #00f0ff 0%, #0088ff 100%); border: none; border-radius: 12px; color: #020712; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 0 25px rgba(0, 229, 255, 0.8); transition: all 0.3s ease; }
    .btn-neon-glow:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(0, 229, 255, 1); }
    .btn-neon-glow svg { width: 18px; height: 18px; stroke: #020712; stroke-width: 2.8; transition: transform 0.3s ease; }
    .btn-neon-glow:hover svg { transform: translateX(4px); }

    .divider-line { display: flex; align-items: center; margin: 22px 0 15px 0; color: #3b4d61; font-size: 12px; }
    .divider-line::before, .divider-line::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .divider-line span { padding: 0 10px; }
    .footer-text { text-align: center; font-size: 11.5px; color: #4f6378; line-height: 1.5; }

    @keyframes fadeCardIn { to { opacity: 1; } }
    @keyframes dropLamp { to { top: 0; } }
    @keyframes bulbFlicker { 0% { background: #111; box-shadow: none; } 20% { background: #fff; box-shadow: 0 0 15px #00e5ff; } 40% { background: #111; box-shadow: none; } 100% { background: #fff; box-shadow: 0 0 15px #00e5ff, 0 0 30px #00e5ff; } }
    @keyframes lightBeamOn { to { opacity: 1; transform: translateX(-50%) scaleY(1); } }
    @keyframes robotRiseUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes floatMascot { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
    @keyframes formSlideIn { to { opacity: 1; transform: translateX(0); } }
    @keyframes laserScanSweep { 0% { top: 5%; opacity: 1; } 45% { top: 92%; opacity: 1; } 50% { opacity: 0; } 100% { top: 5%; opacity: 0; } }
    @keyframes panelShineSweep { 0% { left: -150%; } 100% { left: 200%; } }

    @media (max-width: 767px) {
        .login-page-bg { flex-direction: column; overflow-y: auto; padding: 14px; align-items: center; justify-content: center; }
        .bss-card-container { width: 100%; height: auto; flex-direction: column; }
        .visual-panel { display: none; }
        .form-panel { padding: 30px 20px; }
    }

    /* POST LOGIN SPLASH */
    #welcomeSplash { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; justify-content: center; align-items: center; flex-direction: column; }
    .loader { display: flex; margin-bottom: 40px; }
    .spin { animation: spinDashArray 2s ease-in-out infinite, spin 8s ease-in-out infinite, dashOffset 2s linear infinite; transform-origin: center; stroke-linecap: round; }
    @keyframes dashArray { 0% { stroke-dasharray: 0 1 359 0; } 50% { stroke-dasharray: 0 359 1 0; } 100% { stroke-dasharray: 359 1 0 0; } }
    @keyframes spinDashArray { 0% { stroke-dasharray: 270 90; } 50% { stroke-dasharray: 0 360; } 100% { stroke-dasharray: 270 90; } }
    @keyframes dashOffset { 0% { stroke-dashoffset: 365; } 100% { stroke-dashoffset: 5; } }
    @keyframes spin { 0% { rotate: 0deg; } 25% { rotate: 270deg; } 50% { rotate: 540deg; } 75% { rotate: 810deg; } 100% { rotate: 1080deg; } }
    #welcomeText { font-family: 'Orbitron', 'Inter', sans-serif; font-size: 36px; font-weight: 700; color: #00e5ff; opacity: 0; transform: translateY(20px); transition: all 0.8s ease; text-shadow: 0 0 20px rgba(0,229,255,0.6); text-align: center; margin:0; }
    #welcomeSub { color: #94a3b8; font-size: 14px; margin-top: 12px; opacity: 0; letter-spacing: 2px; transition: all 0.8s ease 0.3s; text-align: center; }
</style>

<div class="login-page-bg">
    <div class="login-particles" id="particles-bg" style="position: absolute; width:100%; height:100%;"></div>
    
    <div class="bss-card-container">
        <div class="visual-panel">
            <div class="lamp-wrapper">
                <div class="lamp-wire"></div><div class="lamp-head"></div><div class="lamp-bulb-glow"></div>
            </div>
            <div class="light-cone"></div>
            <div class="robot-mascot-container">
                <div class="robot-head-shell">
                    <div class="face-scanner-visor">
                        <div class="hud-corner hud-tl"></div><div class="hud-corner hud-tr"></div>
                        <div class="hud-corner hud-bl"></div><div class="hud-corner hud-br"></div>
                        <img src="/static/images/icon-192.png?v=3" class="scan-face-img">
                        <div class="laser-scan-line"></div>
                    </div>
                </div>
                <div class="robot-floor-shadow"></div>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-header anim-item delay-1">
                <h2>Welcome <span>Back.</span></h2>
                <p>BSS v2.0 • Banbhan Scan System</p>
            </div>
            <form id="loginForm">
                <div class="input-box-group anim-item delay-2">
                    <label>USERNAME</label>
                    <div class="input-field-container">
                        <input type="text" id="username" required autocomplete="username" placeholder="Enter username" value="Muhammad Ali">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </div>
                </div>
                <div class="input-box-group anim-item delay-3">
                    <label>PASSWORD</label>
                    <div class="input-field-container">
                        <input type="password" id="password" required autocomplete="current-password" placeholder="Enter password">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                    </div>
                </div>
                <div id="loginError" style="display:none; margin-bottom: 12px; color: #ff4d4d; text-align: left; font-size:12px; font-weight:600;"></div>
                <div class="anim-item delay-4">
                    <button type="submit" class="btn-neon-glow" id="loginBtn">SIGN IN <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg></button>
                    <div class="divider-line"><span>or</span></div>
                    <div class="footer-text">Built by Aoun Ali Banbhan<br>© Aoun Ali & Muhammad Ali</div>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="welcomeSplash">
    <div class="loader">
        <svg height="60" width="60" viewBox="0 0 64 64">
            <circle class="spin" cx="32" cy="32" r="28" fill="none" stroke="#00e5ff" stroke-width="3"></circle>
        </svg>
    </div>
    <h1 id="welcomeText">You are Welcome</h1>
    <p id="welcomeSub">AOUN B1 • BSS System</p>
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/particles.js"></script>
<script>
    if (typeof initParticles === 'function') {
        initParticles('particles-bg', 35);
    }

    // ==================== PREMIUM AUDIO & VOICE ====================
    function playPremiumDing() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // First bell tone
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            gain1.gain.setValueAtTime(0, audioCtx.currentTime);
            gain1.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.05);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(audioCtx.currentTime);
            osc1.stop(audioCtx.currentTime + 1.2);

            // Second bell tone (slightly delayed, higher)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1); // G5
            gain2.gain.setValueAtTime(0, audioCtx.currentTime + 0.1);
            gain2.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(audioCtx.currentTime + 0.1);
            osc2.stop(audioCtx.currentTime + 1.8);
        } catch(e) { console.log("Audio not supported"); }
    }

    function speakWelcome() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance("Welcome to B.S.S. System");
            utterance.rate = 0.95;
            utterance.pitch = 1.0;
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }

    function showWelcomeSplash(redirectUrl) {
        // Hide login card
        document.querySelector('.login-page-bg').style.display = 'none';
        
        // Show black splash screen
        const splash = document.getElementById('welcomeSplash');
        splash.style.display = 'flex';
        
        // PLAY CHIME
        playPremiumDing();

        // 400ms delay: Fade in text and PLAY VOICE
        setTimeout(() => {
            speakWelcome();
            document.getElementById('welcomeText').style.opacity = '1';
            document.getElementById('welcomeText').style.transform = 'translateY(0)';
            document.getElementById('welcomeSub').style.opacity = '1';
        }, 400);

        // Extended delay to 3.5 seconds to ensure voice finishes speaking before redirecting
        setTimeout(() => {
            splash.style.transition = 'opacity 0.6s ease';
            splash.style.opacity = '0';
            setTimeout(() => { window.location.href = redirectUrl; }, 600);
        }, 3500);
    }

    // ==================== LOGIN FORM SUBMIT ====================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const errDiv = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');
        errDiv.style.display = 'none'; 
        btn.innerText = 'Authenticating...';

        let fp = { browser: navigator.userAgent, os: navigator.platform };
        try { if (typeof getDeviceFingerprint === 'function') fp = await getDeviceFingerprint(); } catch(err) {}

        try {
            const res = await fetch('/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value.trim(), 
                    fingerprint: fp
                })
            });
            const data = await res.json();
            if (data.success) { 
                showWelcomeSplash(data.redirect || '/dashboard'); 
            } 
            else { 
                errDiv.textContent = data.error || 'Invalid credentials.'; 
                errDiv.style.display = 'block'; 
                btn.innerHTML = 'SIGN IN <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="18" height="18" stroke="#020712" stroke-width="2.8"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>'; 
            }
        } catch(err) { 
            errDiv.textContent = 'Server error. Please try again.'; 
            errDiv.style.display = 'block'; 
            btn.innerHTML = 'SIGN IN <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" width="18" height="18" stroke="#020712" stroke-width="2.8"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>'; 
        }
    });
</script>
{% endblock %}
